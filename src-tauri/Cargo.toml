[package]
name = "sermonsync"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sermonsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
display-info = "0.5.9"
sha2 = "0.10"
# GTK is used on Linux to request fullscreen on a specific monitor. Wayland
# compositors intentionally ignore client-side window coordinates.
# webkit2gtk is used to auto-grant getUserMedia camera/mic permission requests:
# WebKitGTK denies them by default, which silently breaks navigator.mediaDevices
# for wired/USB (v4l2loopback, DroidCam/OBS virtual cams) in the webview.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "2.0"
glib = "0.18"

# Unix signal support, used to force-kill the Python sidecar on app exit.
# std::process::Child::kill() relies on the child exiting and being reaped,
# which leaves uvicorn running as an orphan; a real SIGKILL does not.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }
